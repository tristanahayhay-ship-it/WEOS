<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEOS</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/three@0.170.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl"></script>
</head>
<body>
<div id="weos">
<header id="topBar">
<div id="brand">WEOS</div>
<div id="statusArea">
<span id="utcClock">00:00:00 UTC</span>
<span id="fpsCounter">FPS --</span>
<span id="connectionStatus">OFFLINE</span>
</div>
</header>

<main id="viewport">
<nav id="leftPanel">
<button>HOME</button>
<button>WORLD</button>
<button>MACRO</button>
<button>MARKET</button>
<button>FLOW</button>
<button>SETTINGS</button>
</nav>

<section id="globeViewport"></section>

<aside id="rightPanel">
<div id="countryPanel">Select a country</div>
</aside>
</main>

<div id="loadingScreen">
<div id="loadingText">WEOS<br>Initializing Visualization Engine...</div>
</div>

<div id="tooltip"></div>
</div>

<script src="app.js"></script>
</body>
</html>
