<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Cashflow - Sinh Thể Kinh Tế Vĩ Mô Toàn Cầu</title>
    
    <!-- SỬA LỖI ĐƯỜNG TRUYỀN: Đổi sang Cloudflare CDN - Máy chủ phân phối lớn nhất thế giới, cam kết không bị chặn tại VN -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #00020a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        #globe-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(4, 12, 32, 0.75);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #00ffcc44;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }

        .btn {
            background: #002244;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px 16px;
            margin-right: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover, .btn.active {
            background: #00ffcc;
            color: #000511;
            box-shadow: 0 0 12px #00ffcc;
        }

        #hud-thudo {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            width: 320px;
            background: rgba(2, 6, 18, 0.85);
            border-left: 4px solid #00ff00;
            padding: 20px;
            border-radius: 4px 12px 12px 4px;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .tieude-hud {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .dong-chiso {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 5px;
        }

        .gia-tri-duong { color: #00ff66; font-weight: bold; }
        .gia-tri-am { color: #ff3344; font-weight: bold; }
    </style>
</head>
<body>

    <div id="globe-container"></div>

    <div id="control-panel">
        <h3 style="margin: 0 0 10px 0; font-size: 1rem; color: #a0aec0;">CHẾ ĐỘ HIỂN THỊ</h3>
        <button class="btn active" id="btn-sphere" onclick="doiGocNhin('sphere')">HÌNH CẦU (3D)</button>
        <button class="btn" id="btn-plane" onclick="doiGocNhin('plane')">HÌNH NGANG (2D)</button>
    </div>

    <div id="hud-thudo">
        <div class="tieude-hud" id="hud-ten-nuoc">VIỆT NAM <span style="font-size: 0.8rem; color: #a0aec0;" id="hud-ten-thudo">(Hà Nội)</span></div>
        <div class="dong-chiso"><span>GDP (Sản lượng nội địa):</span> <span id="chiso-gdp">--</span></div>
        <div class="dong-chiso"><span>CPI (Lạm phát):</span> <span id="chiso-cpi">--</span></div>
        <div class="dong-chiso"><span>UR (Tỷ lệ thất nghiệp):</span> <span id="chiso-ur">--</span></div>
        <div class="dong-chiso"><span>IR (Lãi suất điều hành):</span> <span id="chiso-ir">--</span></div>
        <div class="dong-chiso"><span>Dự trữ Vàng:</span> <span id="chiso-gold" style="color: #ffd700;">--</span></div>
        <div style="font-size: 0.75rem; color: #718096; margin-top: 15px; text-align: center;">Dữ liệu cập nhật thời gian thực từng giây</div>
    </div>

    <script>
        // --- DỮ LIỆU HỆ THẦN KINH TRUNG ƯƠNG ---
        const duLieuHeThanKinhThuDo = [
            { id: "USA", tenNuoc: "HOA KỲ", thudo: "Washington D.C", lat: 38.9072, lng: -77.0369, gdp: "+2.4%", cpi: "2.1%", ur: "4.1%", ir: "4.75%", gold: "8,133 Tấn", trangThai: "XANH" },
            { id: "VNM", tenNuoc: "VIỆT NAM", thudo: "Hà Nội", lat: 21.0285, lng: 105.8542, gdp: "+6.8%", cpi: "3.2%", ur: "2.3%", ir: "4.5%", gold: "9.2 Tấn", trangThai: "XANH" },
            { id: "EU", tenNuoc: "KHỐI LIÊN MINH CHÂU ÂU", thudo: "Frankfurt", lat: 50.1109, lng: 8.6821, gdp: "+0.8%", cpi: "2.6%", ur: "6.5%", ir: "3.5%", gold: "10,776 Tấn", trangThai: "CAM" },
            { id: "CHN", tenNuoc: "TRUNG QUỐC", thudo: "Bắc Kinh", lat: 39.9042, lng: 116.4074, gdp: "+4.5%", cpi: "0.5%", ur: "5.2%", ir: "3.1%", gold: "2,264 Tấn", trangThai: "DO" }
        ];

        // --- DỮ LIỆU HỆ MẠCH MÁU DÒNG TIỀN ---
        let duLieuMachMauDongTien = [
            { startLat: 38.9072, startLng: -77.0369, endLat: 21.0285, endLng: 105.8542, nganh: "FDI - Vốn Đầu Tư Nhà Máy", volume: 1540000000, loaiDongTien: "DAU_TU", tocDo: "BINH_THUONG" },
            { startLat: 38.9072, startLng: -77.0369, endLat: 50.1109, endLng: 8.6821, nganh: "Forex - Thị Trường Tiền Tệ", volume: 8450000000, loaiDongTien: "DAU_TU", tocDo: "GAP_RUT" },
            { startLat: 39.9042, startLng: 116.4074, endLat: 38.9072, endLng: -77.0369, nganh: "Trái Phiếu Chính Phủ Mỹ", volume: 4300000000, loaiDongTien: "THAO_TUNG", tocDo: "GAP_RUT" },
            { startLat: 21.0285, startLng: 105.8542, endLat: 20.9404, endLng: 106.6341, nganh: "Bất Động Sản - KCN Hải Phòng", volume: 450000000, loaiDongTien: "DAU_TU", tocDo: "BINH_THUONG" },
            { startLat: 21.0285, startLng: 105.8542, endLat: 10.8231, endLng: 106.6297, nganh: "Cổ Phiếu - Sàn HOSE TP.HCM", volume: 1250000000, loaiDongTien: "DAU_TU", tocDo: "GAP_RUT" },
            { startLat: 10.8231, startLng: 106.6297, endLat: 21.0285, endLng: 105.8542, nganh: "Vàng Vật Chất Trú Ẩn", volume: 320000000, loaiDongTien: "THAO_TUNG", tocDo: "BINH_THUONG" }
        ];

        // --- KHỞI TẠO BẢN ĐỒ KHÔNG CẦN TẢI ẢNH NGOÀI - CHỐNG LỖI MẠNG ---
        const container = document.getElementById('globe-container');
        const SieuBanDoKinhTe = Globe()(container)
            .showAtmosphere(true)
            .atmosphereColor("#002266")
            .atmospherePower(2.5);

        // Tạo màu không gian sâu cho hệ sinh thái vĩ mô
        if (SieuBanDoKinhTe.scene) {
            // Sử dụng thư viện ThreeJS tích hợp sẵn bên trong để dựng màu nền
            const THREE = window.THREE || SieuBanDoKinhTe.scene().__proto__.constructor;
            if (THREE) SieuBanDoKinhTe.scene().background = new THREE.Color('#00030f');
        }
        // --- ĐỒ HỌA HỆ THẦN KINH (THỦ ĐÔ) ---
        SieuBanDoKinhTe
            .labelsData(duLieuHeThanKinhThuDo)
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => `📍 ${d.thudo}`)
            .labelSize(1.6)
            .labelDotRadius(0.8)
            .labelColor(d => d.trangThai === 'XANH' ? '#00ffcc' : (d.trangThai === 'CAM' ? '#ffaa00' : '#ff3344'))
            .labelResolution(3)
            .onLabelClick((nutThudo) => {
                hienThiBangChisoHUD(nutThudo);
            });

        // --- ĐỒ HỌA HỆ MẠCH MÁU (DÒNG TIỀN PHÌNH TO/CHẠY NHANH) ---
        function capNhatDoHoaMachMau() {
            SieuBanDoKinhTe
                .arcsData(duLieuMachMauDongTien)
                .arcStartLat(d => d.startLat)
                .arcStartLng(d => d.startLng)
                .arcEndLat(d => d.endLat)
                .arcEndLng(d => d.endLng)
                .arcColor(d => d.loaiDongTien === 'DAU_TU' ? '#00ff66' : '#ff2233')
                .arcStroke(d => Math.max(0.6, Math.min(d.volume / 1000000000, 4.0)))
                .arcDashLength(0.5)
                .arcDashGap(0.3)
                .arcDashAnimateTime(d => d.tocDo === 'GAP_RUT' ? 500 : 2000)
                .arcLabel(d => `
                    <div style="background: rgba(0,2,10,0.9); padding: 10px; border: 1px solid #00ffcc; border-radius: 6px; font-family: sans-serif; pointer-events: none;">
                        <b style="color: #00ffcc;">📊 NGÀNH: ${d.nganh}</b><br/>
                        <span style="color: #fff;">Trạng thái: ${d.loaiDongTien === 'DAU_TU' ? '🎯 ĐANG ĐẦU TƯ' : '🚨 THÁO VỐN PHÒNG THỦ'}</span><br/>
                        <b style="color: #ffd700;">Khối lượng: $${Math.round(d.volume).toLocaleString()} USD</b>
                    </div>
                `);
        }

        // Thực thi hiển thị mạch máu ngay khi mở trang web
        capNhatDoHoaMachMau();

        // Vòng lặp liên tục đẩy dòng tiền nhảy số thời gian thực từng giây
        setInterval(() => {
            duLieuMachMauDongTien.forEach(machmau => {
                const bienDong = (Math.random() - 0.5) * 20000000;
                machmau.volume = Math.max(100000000, machmau.volume + bienDong);
                machmau.tocDo = bienDong > 5000000 ? 'GAP_RUT' : 'BINH_THUONG';
            });
            capNhatDoHoaMachMau();
            
            const hud = document.getElementById('hud-thudo');
            if (hud.style.display === 'block') {
                const idHienTai = hud.getAttribute('data-country-id');
                const nutThudo = duLieuHeThanKinhThuDo.find(n => n.id === idHienTai);
                if(nutThudo) capNhatTextHUD(nutThudo);
            }
        }, 1000);

        // --- LOGIC ĐIỀU KHIỂN HUD VÀ CHẾ ĐỘ XEM MAP ---
        function hienThiBangChisoHUD(data) {
            const hud = document.getElementById('hud-thudo');
            hud.setAttribute('data-country-id', data.id);
            hud.style.display = 'block';
            hud.style.borderLeftColor = data.trangThai === 'XANH' ? '#00ff66' : (data.trangThai === 'CAM' ? '#ffaa00' : '#ff3344');
            capNhatTextHUD(data);
        }

        function capNhatTextHUD(data) {
            document.getElementById('hud-ten-nuoc').innerHTML = `${data.tenNuoc} <span style="font-size: 0.8rem; color: #a0aec0;">(${data.thudo})</span>`;
            document.getElementById('chiso-gdp').className = data.trangThai === 'DO' ? 'gia-tri-am' : 'gia-tri-duong';
            document.getElementById('chiso-gdp').innerText = data.gdp;
            document.getElementById('chiso-cpi').innerText = data.cpi;
            document.getElementById('chiso-ur').innerText = data.ur;
            document.getElementById('chiso-ir').innerText = data.ir;
            document.getElementById('chiso-gold').innerText = data.gold;
        }

        function doiGocNhin(loaiGocNhin) {
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            if (loaiGocNhin === 'plane') {
                document.getElementById('btn-plane').classList.add('active');
                SieuBanDoKinhTe.globeMode('2d');
            } else {
                document.getElementById('btn-sphere').classList.add('active');
                SieuBanDoKinhTe.globeMode('earth');
            }
        }
    </script>
</body>
</html>
